name: Redeploy to Cloud Run
# Run this by hand from the Actions tab: "Run workflow".
# It needs one repository secret, GCP_SA_KEY (see the README section "Redeploying").
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_ID: corinne-portfolio
      REGION: us-central1
      SERVICE: pc-rail-accident-hotspots-and-causes
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Google Cloud key
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Add the GCP_SA_KEY secret first. See README > Redeploying."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        run: |
          gcloud run deploy "$SERVICE" --source . --project "$PROJECT_ID" --region "$REGION" \
            --allow-unauthenticated --memory 1Gi --cpu 1 --min-instances 0 --max-instances 2 \
            --timeout 3600 --session-affinity --quiet
